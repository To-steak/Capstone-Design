<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>LLM 응답 테스트</title>
</head>

<body>
    <h2>LLM 응답 테스트</h2>

    <label for="role">역할 선택:</label>
    <select id="role">
        <option>World Tree</option>
        <option>Earth</option>
        <option>Tree</option>
        <option>Water</option>
    </select><br><br>

    <label for="damaged">피해 정도 (0~10):</label>
    <input type="number" id="damaged" min="0" max="10" value="5"><br><br>

    <button onclick="sendRequest()">응답 요청</button>

    <p><strong>LLM 응답:</strong></p>
    <pre id="response"></pre>

    <script>
        async function sendRequest() {
            const role = document.getElementById("role").value;
            const damaged = parseInt(document.getElementById("damaged").value, 10);

            try {
                const res = await fetch("/response", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ role, damaged })
                });

                // PlainTextResponse 를 받으므로 .text() 사용
                let text = await res.text();
                // 선행 개행(\n)을 모두 제거
                text = text.replace(/^\n+/, '');

                document.getElementById("response").innerText = text;
            } catch (err) {
                document.getElementById("response").innerText = "오류 발생: " + err;
            }
        }
    </script>

</body>

</html>
